<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEX Fuel - Supervisor de Campo</title>
    
    <meta name="theme-color" content="#FF454B">
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JEX Fuel">
    <link rel="apple-touch-icon" href="assets/logo_jex.png">

    <link rel="stylesheet" href="styles_pwa.css">
</head>
<body>

    <div class="header">
        <h2>Control de Combustible</h2>
        <div style="color: #FF454B; font-size: 12px; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px;">📋 PWA MÓVIL — CAMPO</div>
    </div>

    <div id="connection-status" class="status-badge" style="margin-bottom: 15px;">
        🟢 CONECTADO AL PLANTEL JEX
    </div>

    <p class="section-title">Datos Generales</p>
    <div class="card">
        <label>Fecha de Operación</label>
        <input type="date" id="log_date">

        <label>Guardia / Turno</label>
        <select id="shift">
            <option value="-">-- SELECCIONE TURNO --</option>
            <option value="DIA">DIA</option>
            <option value="NOCHE">NOCHE</option>
        </select>

        <label>Tipo de Combustible</label>
        <select id="fuel_type">
            <option value="DIESEL B5">DIESEL B5</option>
        </select>

        <label>Operador de Cisterna</label>
        <select id="operator">
            <option value="">Cargando operadores...</option>
        </select>

        <label>Cisterna (Placa de Unidad)</label>
        <select id="truck">
            <option value="">Cargando cisternas...</option>
        </select>
    </div>

    <p class="section-title">Equipos Despachados</p>
    <div class="card">
        <div id="equipments-container">

        </div>
        <div style="overflow: hidden; margin-top: 10px;">
            <button class="btn-secondary" onclick="agregarFila()">➕ AGREGAR FILA</button>
        </div>
    </div>

    <p class="section-title">Observaciones de Campo</p>
    <div class="card">
        <textarea id="remarks" rows="3" placeholder="Notas e incidencias en plantel..."></textarea>
    </div>

    <button class="btn-primary" onclick="enviarReporte()">Enviar Reporte a Plataforma</button>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🚀 PWA: Service Worker registrado.', reg))
                    .catch(err => console.error('❌ PWA: Error al registrar Service Worker.', err));
            });
        }

        const BACKEND_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:8000"
            : `http://${window.location.hostname}:8000`;

        const SUPERVISOR_ACTIVO = localStorage.getItem("jex_supervisor_id") || "SUP-01"; 

        // ===========================================================================
        // CONFIGURACIÓN DE INDEXEDDB (OFFLINE STORAGE)
        // ===========================================================================
        let dbLocal;
        const requestDB = indexedDB.open("JEX_Local_DB", 1);

        requestDB.onupgradeneeded = function(event) {
            const db = event.target.result;
            if (!db.objectStoreNames.contains("despachos_pendientes")) {
                db.createObjectStore("despachos_pendientes", { keyPath: "id", autoIncrement: true });
            }
        };

        requestDB.onsuccess = function(event) {
            dbLocal = event.target.result;
            console.log("IndexedDB inicializado correctamente.");
        };

        requestDB.onerror = function(event) {
            console.error("IndexedDB error:", event.target.error);
        };

        document.getElementById('log_date').value = new Date().toISOString().split('T')[0];

        // ===========================================================================
        // CARGA DE CATÁLOGOS CON CACHÉ LOCAL
        // ===========================================================================
        async function cargarCatalogos() {
            try {
                const resOpe = await fetch(`${BACKEND_URL}/api/operators`);
                const operadores = await resOpe.json();
                localStorage.setItem("jex_cached_operators", JSON.stringify(operadores));
                renderOperadores(operadores);

                const resTru = await fetch(`${BACKEND_URL}/api/fuel-trucks`);
                const cisternas = await resTru.json();
                localStorage.setItem("jex_cached_trucks", JSON.stringify(cisternas));
                renderCisternas(cisternas);
            } catch (error) {
                console.warn("Sin conexión directa. Usando catálogos en caché local.");
                marcarOffline();
                const cachedOpe = JSON.parse(localStorage.getItem("jex_cached_operators") || "[]");
                const cachedTru = JSON.parse(localStorage.getItem("jex_cached_trucks") || "[]");
                renderOperadores(cachedOpe);
                renderCisternas(cachedTru);
            }
        }

        function renderOperadores(lista) {
            const select = document.getElementById("operator");
            select.innerHTML = '<option value="-">-- SELECCIONE OPERADOR --</option>';
            lista.forEach(o => select.innerHTML += `<option value="${o.id}">${o.name}</option>`);
        }

        function renderCisternas(lista) {
            const select = document.getElementById("truck");
            select.innerHTML = '<option value="-">-- SELECCIONE CISTERNA --</option>';
            lista.forEach(t => select.innerHTML += `<option value="${t.id}">${t.name}</option>`);
        }

        function marcarOffline() {
            const status = document.getElementById("connection-status");
            status.innerHTML = "⚠️ MODO OFFLINE — GUARDANDO EN MEMORIA LOCAL";
            status.style.borderColor = "#FF454B";
            status.style.color = "#FF454B";
        }

        function agregarFila(name = "", code = "", qty = "") {
            const container = document.getElementById("equipments-container");
            const div = document.createElement("div");
            div.className = "grid-row";
            div.innerHTML = `
                <input type="text" placeholder="Ej: Excavadora CAT" class="eq-name" value="${name}">
                <input type="text" placeholder="Ej: EX-04" class="eq-code" value="${code}">
                <input type="number" step="0.1" placeholder="Gln" class="eq-qty" value="${qty}">
                <button class="btn-delete" type="button" onclick="this.parentElement.remove()">🗑️</button>
            `;
            container.appendChild(div);
        }

        // ===========================================================================
        // PERSISTENCIA OFFLINE EN INDEXEDDB
        // ===========================================================================
        function guardarDespachoOffline(payload) {
            if (!dbLocal) {
                alert("❌ Error: Base de datos local no inicializada.");
                return;
            }

            const transaction = dbLocal.transaction(["despachos_pendientes"], "readwrite");
            const store = transaction.objectStore("despachos_pendientes");
            const request = store.add(payload);

            request.onsuccess = function() {
                alert("⚠️ Sin señal: Despacho guardado en la memoria de este celular. Se sincronizará automáticamente al detectar conexión.");
                document.getElementById("equipments-container").innerHTML = "";
                document.getElementById("remarks").value = "";
                agregarFila();
            };

            request.onerror = function(event) {
                alert("❌ Error al guardar localmente: " + event.target.error);
            };
        }

        // ===========================================================================
        // ENVÍO TRANSACCIONAL
        // ===========================================================================
        async function enviarReporte() {
            const shift = document.getElementById("shift").value;
            const operator_id = document.getElementById("operator").value;
            const truck_id = document.getElementById("truck").value;
            
            if (shift === "-" || operator_id === "-" || truck_id === "-" || !operator_id || !truck_id) {
                alert("⚠️ Complete todos los campos generales obligatorios.");
                return;
            }

            const rows = document.querySelectorAll(".grid-row");
            const equipments = [];
            
            rows.forEach((row, index) => {
                const name = row.querySelector(".eq-name").value.trim();
                const code = row.querySelector(".eq-code").value.trim();
                const qty = parseFloat(row.querySelector(".eq-qty").value);

                if (name && code && qty > 0) {
                    equipments.push({
                        "item_number": index + 1,
                        "equipment_name": name,
                        "equipment_code": code,
                        "quantity_gln": qty
                    });
                }
            });

            if (equipments.length === 0) {
                alert("⚠️ Debe registrar al menos un equipo con galonaje mayor a cero.");
                return;
            }

            const payload = {
                "log_date": document.getElementById("log_date").value,
                "shift": shift,
                "fuel_type": document.getElementById("fuel_type").value,
                "supervisor_id": SUPERVISOR_ACTIVO,
                "operator_id": operator_id,
                "truck_id": truck_id,
                "remarks": document.getElementById("remarks").value.trim(),
                "equipments": equipments
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/fuel-logsheet-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("🚀 ¡Reporte enviado con éxito al servidor central!");
                    document.getElementById("equipments-container").innerHTML = "";
                    document.getElementById("remarks").value = "";
                    agregarFila();
                } else {
                    const err = await response.json();
                    alert(`❌ Error del servidor: ${err.detail || "Transacción rechazada"}`);
                }
            } catch (error) {
                console.log("Red inaccesible. Guardando en almacenamiento local...");
                guardarDespachoOffline(payload);
            }
        }

        // ===========================================================================
        // SINCRONIZACIÓN AUTOMÁTICA EN SEGUNDO PLANO
        // ===========================================================================
        async function sincronizarDespachosPendientes() {
            if (!dbLocal) return;

            const transaction = dbLocal.transaction(["despachos_pendientes"], "readonly");
            const store = transaction.objectStore("despachos_pendientes");
            const request = store.getAll();

            request.onsuccess = async function(event) {
                const registros = event.target.result;
                if (!registros || registros.length === 0) return;

                console.log(`📡 Sincronizador: Subiendo ${registros.length} reportes pendientes...`);
                
                for (let registro of registros) {
                    try {
                        const { id, ...payloadParaAPI } = registro;

                        const response = await fetch(`${BACKEND_URL}/api/fuel-logsheet-complete`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payloadParaAPI)
                        });

                        if (response.ok) {
                            const deleteTx = dbLocal.transaction(["despachos_pendientes"], "readwrite");
                            deleteTx.objectStore("despachos_pendientes").delete(id);
                            console.log(`✅ Reporte #${id} sincronizado.`);
                        }
                    } catch (err) {
                        console.warn("Servidor aún no disponible. Reintentando después.");
                        break;
                    }
                }
            };
        }

        window.addEventListener("online", () => {
            const status = document.getElementById("connection-status");
            status.innerHTML = "🟢 CONECTADO AL PLANTEL JEX";
            status.style.borderColor = "#475569";
            status.style.color = "#94A3B8";
            cargarCatalogos();
            sincronizarDespachosPendientes();
        });

        window.addEventListener("offline", marcarOffline);

        window.addEventListener("DOMContentLoaded", () => {
            cargarCatalogos();
            agregarFila();
            setTimeout(sincronizarDespachosPendientes, 2500);
        });
    </script>
</body>
</html>
